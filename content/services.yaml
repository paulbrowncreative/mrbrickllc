  # ------------------------------------------------------------ STRUCTURAL
  foundation-services:
    name: Foundations & Retaining Walls
    category: structural
    hub: true
    title: Foundations & Footings in Southeastern Michigan | Mr. Brick
    description: Foundation crack repair, footings, block foundations for porches and additions, and retaining walls across Southeastern Michigan. Free quotes.
    h1: Foundations and footings
    lede: Footings, block foundations and foundation repairs for homes, porches, garages and additions.
    image: footing-excavation
    tags: [foundations, retaining-walls]
    intro: |
      Everything above a foundation depends on it. We build new foundations and footings for porches, additions, garages and outdoor structures, and we repair cracked and deteriorated foundation masonry.

      Some foundation problems are structural and need an engineer's evaluation before any contractor should start work. If we see signs of that, we'll tell you before recommending a repair.
    signs:
      - Stair-step cracks in block foundation walls
      - Horizontal cracks or bowing walls
      - Water entering through foundation cracks
      - Crumbling or deteriorated block or mortar
    includes:
      - Footings below frost depth
      - Block and poured foundations for porches, additions and garages
      - Foundation crack repair
      - Repointing and block replacement
      - Drainage improvements at the foundation
    related: [foundation-repair, retaining-wall-services, cinder-block-wall-installation, porch-rebuilds]
    faqs:
      - q: Do you do basement waterproofing?
        a: Call us to talk through your situation. We repair foundation masonry and cracks and can address drainage at the foundation; we'll tell you honestly whether your problem is one we should take on.
      - q: How deep do footings need to be in Michigan?
        a: Footings must extend below the frost line — commonly 42 inches in Southeastern Michigan. Your local building department sets the requirement for your project.

  foundation-repair:
    name: Foundation Repair
    category: structural
    title: Foundation Repair in Southeastern Michigan | Mr. Brick
    description: Foundation crack repair, block replacement and repointing for Southeastern Michigan homes. Honest assessments and free quotes from Mr. Brick.
    h1: Foundation repair
    lede: Cracked and deteriorated foundation masonry repaired — with an honest read on whether you need a mason or an engineer first.
    image: porch-block-foundation
    tags: [foundations]
    intro: |
      Not every foundation crack is a crisis. Hairline shrinkage cracks in poured walls and minor stair-step cracks in block are common and usually repairable. Horizontal cracks, bowing walls, and cracks that keep widening are different — they point to soil pressure or settlement that needs to be understood before anything is patched.

      We repair foundation masonry and, when a problem goes beyond masonry, we'll say so plainly.
    signs:
      - Stair-step cracks in block walls
      - Cracks that let water in
      - Crumbling mortar or deteriorated block
      - Horizontal cracks or bowing (have these evaluated)
    includes:
      - Assessment of cracks and wall condition
      - Crack repair and sealing
      - Block replacement and repointing
      - Drainage corrections at the foundation
      - Referral to a structural engineer when warranted
    approach: |
      The cheapest foundation repair is the one that addresses the cause. Downspouts discharging at the wall and soil sloping toward the house are behind a large share of foundation cracks and leaks.
    related: [foundation-services, cinder-block-wall-installation, retaining-wall-services]
    faqs:
      - q: Are foundation cracks normal?
        a: Small, stable cracks are common. Cracks that are wide, horizontal, widening over time, or accompanied by bowing walls should be evaluated.
      - q: Can you fix a leaking foundation crack?
        a: Many leaking cracks can be repaired. We'll also look at grading and downspouts, which are often the source of the water.

  retaining-wall-services:
    name: Retaining Walls
    category: structural
    title: Retaining Wall Installation in SE Michigan | Mr. Brick
    description: Block, segmental, stone and brick retaining walls with proper base, drainage and reinforcement. Serving Southeastern Michigan. Free quotes.
    h1: Retaining wall installation
    lede: Walls that hold back soil for years — built with the base, drainage and reinforcement that decide whether a retaining wall stands or leans.
    image: block-wall-concrete-steps
    tags: [retaining-walls]
    intro: |
      Retaining walls fail for three reasons: a weak base, water trapped behind the wall, or not enough reinforcement for the height. The face of the wall is the part everyone sees; the part that keeps it standing is below grade and behind it.

      We build retaining walls in segmental block, concrete block, stone and brick, and we rebuild walls that have leaned or collapsed.
    signs:
      - Walls leaning or bulging outward
      - Cracks or separated blocks
      - Soil washing out at the base or through joints
      - Standing water behind the wall
    includes:
      - Excavation and compacted base or footing
      - Drainage aggregate and drain pipe behind the wall
      - Segmental, block, stone or brick construction
      - Reinforcement for taller walls
      - Caps and finished ends
      - Rebuilding of failed walls
    options:
      - {name: Segmental block walls, text: "Interlocking units — the most common landscape retaining wall."}
      - {name: Concrete block walls, text: "Reinforced CMU, often faced with brick or stone."}
      - {name: Stone walls, text: "Natural stone for a traditional landscape look."}
    approach: |
      Taller walls may need an engineered design and a permit. We'll tell you when your wall crosses that line.
    related: [cinder-block-wall-installation, patio-services, foundation-services]
    faqs:
      - q: Why do retaining walls lean?
        a: Usually water pressure from missing drainage, an inadequate base, or not enough reinforcement for the wall's height.
      - q: Can a leaning retaining wall be fixed?
        a: Minor issues sometimes can. More often the wall needs to be taken down and rebuilt with proper drainage and base.
