  group: Working with Mr. Brick
  home: true
  a: We're based in Eastpointe and serve homes and businesses throughout Southeastern Michigan, including Macomb, Wayne and Oakland counties. Not sure about your address? Call or text and ask.
- q: Are you licensed and insured?
  group: Working with Mr. Brick
  home: true
  a: Yes. Mr. Brick LLC is licensed and insured.
- q: Do you offer a warranty?
  group: Working with Mr. Brick
  home: true
  a: Mr. Brick provides a 10-year warranty on all new construction. Ask us about warranty coverage for your specific project.
- q: Do you work on commercial properties?
  group: Working with Mr. Brick
