# General FAQs (home page + /faqs). Answers restate only verified business facts.
- q: Does Mr. Brick offer free quotes?
  a: Yes. Quotes are free and there's no obligation. Call or text (586) 209-3052, or request a quote online and tell us about your project.
- q: What areas do you serve?
  a: We're based in Eastpointe and serve homes and businesses throughout Southeastern Michigan, including Macomb, Wayne and Oakland counties.
- q: Are you licensed and insured?
  a: Yes. Mr. Brick LLC is licensed and insured.
- q: Do you offer a warranty?
  a: Mr. Brick provides a 10-year warranty on all new construction. Ask us about warranty coverage for your specific project.
- q: Do you price match?
  a: Yes. We'll price match written quotes from licensed competitors for comparable work.
- q: Is financing available?
  a: Yes. Financing options are available on qualifying projects. Call us to talk through the options.
- q: What forms of payment do you accept?
  a: Cash, check, Visa, Mastercard, Discover and American Express, plus Apple Pay, Google Pay, Samsung Pay, Zelle, Venmo and Cash App. Financing is also available.
- q: Do you work on commercial properties?
  a: Yes. Mr. Brick handles both residential and commercial masonry and concrete work.
- q: How do I know if my brick needs tuckpointing?
  a: Michigan's freeze-thaw cycles wear out mortar joints over time. Watch for mortar that is cracked, crumbling or recessed, loose or missing bricks, and white staining (efflorescence) on the wall. If you see these, a professional assessment is worthwhile.
- q: Do you offer discounts?
  a: We offer discounts for active military and veterans, first responders and seniors, plus periodic promotions. Mention your discount when you schedule — offers can't be combined.
