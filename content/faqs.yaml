# General FAQs (home page + /faqs). Answers restate only verified business facts
# or general, widely accepted masonry practice. No prices are published: cost
# answers explain what drives price instead. `group` controls /faqs sections;
# `home: true` puts a question on the home page (keep it to ~6).
- q: Does Mr. Brick offer free quotes?
  group: Quotes & pricing
  home: true
  a: Yes. Quotes are free and there's no obligation. Call or text (586) 209-3052, or request a quote online and tell us about your project. Photos help us give you a better first answer.
- q: How much does masonry repair cost?
  group: Quotes & pricing
  home: true
  a: It depends on the size of the repair, access (ground level or rooftop), the materials that need to be matched, and whether the underlying cause, such as a failed crown or poor drainage, also has to be fixed. A few replaced bricks and a full section rebuild are very different jobs. We look at the project and give you a written price before any work starts.
- q: How much does chimney repair cost?
  group: Quotes & pricing
  a: Chimney pricing depends on the chimney's height and roof pitch, how many courses need work, whether the crown or cap needs replacing, and whether a partial rebuild is needed. A new crown and repointing costs far less than a rebuild, which is why catching problems early matters. We'll inspect it and quote the repair it actually needs.
- q: Do you price match?
  group: Quotes & pricing
  a: Yes. We'll price match written quotes from licensed competitors for comparable work.
- q: Is financing available?
  group: Quotes & pricing
  home: true
  a: Yes. Financing options are available on qualifying projects. Call us to talk through the options.
- q: What forms of payment do you accept?
  group: Quotes & pricing
  a: Cash, check, Visa, Mastercard, Discover and American Express, plus Apple Pay, Google Pay, Samsung Pay, Zelle, Venmo and Cash App. Financing is also available.
- q: Do you offer discounts?
  group: Quotes & pricing
  a: We offer discounts for active military and veterans, first responders and seniors, plus periodic promotions. Mention your discount when you schedule. Offers can't be combined.

