- q: Do you handle permits?
  group: Working with Mr. Brick
  a: Permit requirements vary by city and project. Porch rebuilds, new steps and driveway approaches often need one. We'll tell you what your project requires before work is scheduled.

- q: How long does a masonry project take?
  group: Projects & timing
  a: Small repairs like replacing a few bricks or a chimney cap can take a day. Porch rebuilds, chimney rebuilds and driveways typically take several days of work, plus curing time. Weather matters too, since mortar and concrete can't be placed when they'll freeze. We'll give you a realistic timeline with your quote.
- q: How long does tuckpointing last?
  group: Projects & timing
  a: Properly done repointing with compatible mortar commonly lasts decades. Chimneys, parapets and walls under downspouts or roof runoff wear out sooner. Fixing the water source along with the joints makes the repair last longer.
- q: How long does new concrete take to cure?
  group: Projects & timing
  a: As a general guide, new concrete can usually take foot traffic after a day or two and passenger cars after about a week, and it keeps gaining strength for about a month. Temperature and mix affect those times, so we'll give you specific guidance for your pour.
- q: Can masonry work be done in winter?
  group: Projects & timing
  a: Mortar and concrete need above-freezing temperatures to cure properly, so most exterior masonry is scheduled from spring through late fall. Some repairs can be done in mild winter weather. Call and we'll tell you what's possible for your project.

- q: When should brick be replaced instead of repointed?
  group: Brick, chimneys & foundations
  a: If only the mortar is worn and the bricks are tight and sound, repointing is enough. Brick needs replacing when faces are flaking off (spalling), bricks are cracked through or loose, or a section is bulging or leaning. Read our guide on <a href="/resources/tuckpointing-vs-rebuilding">tuckpointing vs. rebuilding</a>.
- q: How do I know if my brick needs tuckpointing?
  group: Brick, chimneys & foundations
  a: Michigan's freeze-thaw cycles wear out mortar joints over time. Watch for mortar that is cracked, crumbling or recessed, loose or missing bricks, and white staining (efflorescence) on the wall. If you see these, a professional assessment is worthwhile.
- q: Do you repair cracked foundations?
  group: Brick, chimneys & foundations
  a: Yes. We repair cracked and deteriorated masonry foundations, block walls and footings. Some foundation problems, such as active movement or bowing basement walls, may need a structural engineer's evaluation first. We'll tell you honestly if yours does.
