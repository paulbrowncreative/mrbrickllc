# Verified customer reviews ONLY, copied word for word from the Google
# Business Profile (or Facebook). Never invent, edit or paraphrase a review.
# When this list has entries the site shows them automatically:
#   - a scrolling review marquee on the home page and every service page
#   - every review as cards on /reviews
# Also fill in google_rating (and update google_review_count) in site.yaml.
#
# Format (one entry per review; rating 1-5; date YYYY-MM-DD, or leave it out):
#
# reviews:
#   - name: "Jane D."
#     rating: 5
#     date: 2026-05-01
#     source: Google
#     text: >-
#       Paste the full review text here exactly as written.
#
# Use first name + last initial unless the reviewer's Google display name is
# already public in that form.
reviews:
  - name: "Katie R."
    rating: 5
    source: Google
    text: >-
      I hired Mr. Brick to do some work on my chimney. They were fast, professional and friendly. The worke turned out great, you can tell they put a lot of pride into it. Will certainly hire them again if ever needed and would recommend to others.
