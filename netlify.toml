[build]
  command = "python3 build.py"
  publish = "dist"

[functions]
  # lead.mjs serves POST /api/lead: validates quote requests and emails them via Resend.
  # Functions deploy from Git or the Netlify CLI, not from drag-and-drop zips.
  directory = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

# Pretty URLs keep legacy slugs like /chimney-repair serving chimney-repair.html
[build.processing.html]
  pretty_urls = true

# Security and cache headers are generated by build.py into dist/_headers,
# and redirects into dist/_redirects, so Git deploys and drag-and-drop zip
# deploys behave identically.
